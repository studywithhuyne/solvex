services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cex_test
      POSTGRES_PASSWORD: cex_test
      POSTGRES_DB: cex_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex_test -d cex_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - test_pgdata:/var/lib/postgresql/data
volumes:
  test_pgdata:
